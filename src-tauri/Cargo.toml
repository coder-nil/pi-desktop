[package]
name = "pi-desktop"
version = "0.84.2-alpha.2"
description = "Desktop shell for Pi Desktop"
authors = ["Pi Desktop contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "pi_web_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
libc = "0.2"
serde_json = "1"
tauri = { version = "2.0.0", features = [] }
