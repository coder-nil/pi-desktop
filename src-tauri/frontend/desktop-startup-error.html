<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pi Agents could not start</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 28px; background: Canvas; color: CanvasText; }
      h1 { margin: 0 0 16px; font-size: 22px; letter-spacing: 0; }
      pre { min-height: 150px; margin: 0; padding: 14px; overflow: auto; border: 1px solid GrayText; border-radius: 6px; white-space: pre-wrap; user-select: text; font: 13px/1.5 ui-monospace, monospace; }
      p { margin: 14px 0 0; color: GrayText; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Pi Agents could not start</h1>
    <pre id="details">Waiting for startup details...</pre>
    <p>Select the text above to copy the error and log path.</p>
    <script>
      document.getElementById("details").textContent =
        window.__PI_WEB_STARTUP_ERROR__ || "No startup details were provided.";
    </script>
  </body>
</html>
