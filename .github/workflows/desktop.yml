name: Desktop packages

on:
  push:
    branches:
      - "v*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (for example, v0.84.2-aphla.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS ARM64
            node_target: darwin-arm64
            rust_target: aarch64-apple-darwin
            artifact: macos-arm64
            smoke_with_system_node: true
          - os: macos-14
            name: macOS Intel
            node_target: darwin-x64
            rust_target: x86_64-apple-darwin
            artifact: macos-x64
            smoke_with_system_node: true
          - os: windows-2022
            name: Windows x64
            node_target: win-x64
            rust_target: x86_64-pc-windows-msvc
            artifact: windows-x64
            smoke_with_system_node: false
          - os: ubuntu-24.04
            name: Linux x64
            node_target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            smoke_with_system_node: false
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.8.4 --locked
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache Windows bundler tools
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: src-tauri/target/.tauri
          key: tauri-windows-nsis-${{ hashFiles('scripts/prepare-windows-bundler.mjs') }}
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare and verify Windows bundler tools
        if: runner.os == 'Windows'
        run: node scripts/prepare-windows-bundler.mjs
      - name: Build Next.js standalone server
        run: npm run desktop:prepare:server
      - name: Build static desktop frontend
        run: npm run desktop:prepare:frontend
      - name: Prepare embedded Node runtime
        run: npm run desktop:prepare:runtime -- --node-target=${{ matrix.node_target }}
      - name: Smoke test standalone server with embedded Node
        if: ${{ !matrix.smoke_with_system_node }}
        run: npm run desktop:smoke
      - name: Smoke test standalone server for cross-compiled macOS bundle
        if: ${{ matrix.smoke_with_system_node }}
        run: npm run desktop:smoke -- --system-node
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Ad-hoc sign embedded Node runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign \
            --force \
            --options runtime \
            --sign - \
            desktop-dist/node
          codesign --verify --strict --verbose=2 desktop-dist/node

      - name: Build ad-hoc signed macOS bundle
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: cargo tauri build --target ${{ matrix.rust_target }}

      - name: Verify macOS bundle integrity
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle_root="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          app_path="$bundle_root/macos/Pi Desktop.app"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          if [[ ! -d "$app_path" || -z "$dmg_path" ]]; then
            echo '::error::The expected macOS application or DMG was not generated.'
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q '^Signature=adhoc$'

          mount_point="$RUNNER_TEMP/pi-desktop-dmg-${{ matrix.artifact }}"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_point/Pi Desktop.app"

          dmg_directory="$(dirname "$dmg_path")"
          dmg_name="$(basename "$dmg_path")"
          (cd "$dmg_directory" && shasum -a 256 "$dmg_name") \
            > "$bundle_root/SHA256SUMS-${{ matrix.artifact }}.txt"

      - name: Build Linux Tauri bundle
        if: runner.os == 'Linux'
        run: cargo tauri build --target ${{ matrix.rust_target }}

      - name: Build Windows NSIS installer with retries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            cargo tauri build --target "${{ matrix.rust_target }}" --bundles nsis
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              $delay = 15 * $attempt
              Write-Warning "Windows bundling attempt $attempt failed; retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          exit $exitCode
      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/SHA256SUMS-*.txt
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
