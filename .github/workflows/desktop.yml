name: Desktop packages

on:
  push:
    branches:
      - "v*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (for example, v0.84.2-aphla.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS ARM64
            node_target: darwin-arm64
            rust_target: aarch64-apple-darwin
            artifact: macos-arm64
            smoke_with_system_node: true
          - os: macos-14
            name: macOS Intel
            node_target: darwin-x64
            rust_target: x86_64-apple-darwin
            artifact: macos-x64
            smoke_with_system_node: true
          - os: windows-2022
            name: Windows x64
            node_target: win-x64
            rust_target: x86_64-pc-windows-msvc
            artifact: windows-x64
            smoke_with_system_node: false
          - os: ubuntu-24.04
            name: Linux x64
            node_target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            smoke_with_system_node: false
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.8.4 --locked
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build Next.js standalone server
        run: npm run desktop:prepare:server
      - name: Build static desktop frontend
        run: npm run desktop:prepare:frontend
      - name: Prepare embedded Node runtime
        run: npm run desktop:prepare:runtime -- --node-target=${{ matrix.node_target }}
      - name: Smoke test standalone server with embedded Node
        if: ${{ !matrix.smoke_with_system_node }}
        run: npm run desktop:smoke
      - name: Smoke test standalone server for cross-compiled macOS bundle
        if: ${{ matrix.smoke_with_system_node }}
        run: npm run desktop:smoke -- --system-node
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri bundle
        run: cargo tauri build --target ${{ matrix.rust_target }}
      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
