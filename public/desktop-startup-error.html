<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Pi Desktop could not start</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a1a1a;
        color: #e8e8e8;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main { width: min(100%, 620px); }

      header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
      }

      img { width: 48px; height: 48px; }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
      }

      p {
        margin: 0 0 10px;
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.6;
      }

      pre {
        max-height: 220px;
        margin: 18px 0 0;
        padding: 14px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        background: #111;
        color: #fca5a5;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      button {
        margin-top: 22px;
        min-height: 40px;
        padding: 0 18px;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        background: #242424;
        color: #e8e8e8;
        font: inherit;
        cursor: pointer;
      }

      button:hover { background: #2e2e2e; }
      button:focus-visible { outline: 2px solid #60a5fa; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="/icons/icon-192.png" alt="" />
        <h1>Pi Desktop could not start</h1>
      </header>
      <p>The local Pi Desktop server exited before the application was ready.</p>
      <pre id="error">No additional error details were provided.</pre>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      (() => {
        const value = window.__PI_WEB_STARTUP_ERROR__;
        if (typeof value === "string" && value.trim()) {
          document.getElementById("error").textContent = value;
        }
      })();
    </script>
  </body>
</html>
